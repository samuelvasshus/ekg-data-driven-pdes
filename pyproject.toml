[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekgpde"
version = "0.1.0"
description = "Data-driven ODE/PDE tools for ECG time series"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "wfdb",
]

[project.optional-dependencies]
dev = ["jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
